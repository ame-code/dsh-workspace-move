name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain:
    name: chain / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the build toolchain
        run: npm install --no-audit --no-fund

      - name: Build the client bundle
        run: npm run build

      - name: Install the Harness CLI
        run: |
          npm install --global pnpm@10
          npm install --global @deepseek-ai/dsh@0.2.2-rc.1

      - name: Move a workspace through a real dsh web host
        run: npm run test:chain

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the Harness packages the end-to-end run needs
        run: npm install --no-audit --no-fund

      - name: Pure logic and platform semantics
        run: npm test

      - name: Client bundle contract
        run: npm run check

      - name: Move a workspace against real Harness services
        run: npm run test:e2e

      - name: The published package carries what it promises
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const report = require('./pack.json')[0];
            const names = report.files.map((file) => file.path);
            const must = ['lib/client.js', 'lib/index.js', 'cordis.patch.yml', 'locale/en.json', 'locale/zh.json', 'icon/icon.svg', 'README.md', 'LICENSE'];
            const missing = must.filter((name) => !names.includes(name));
            if (missing.length > 0) { console.error('missing from the package:', missing); process.exit(1); }
            if (names.some((name) => name.startsWith('node_modules/'))) { console.error('node_modules leaked into the package'); process.exit(1); }
            console.log('package ok:', names.length, 'files');
          "
